services:
  api:
    build:
      context: .
      target: dev
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      # Helps file-watching inside Docker on some systems
      CHOKIDAR_USEPOLLING: "true"
    command: npm run start:dev
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "8080:3000"
